files:
  .env:
    type: literal
    actions: [read]
    params:
      path: [Path.parent.parent]
  DATA_DIR:
    type: variable
    actions: [write]
    params:
      caller: [DATA_DIR.mkdir]
  document_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, Path]
  LOGS_DIR:
    type: variable
    actions: [write]
    params:
      caller: [LOGS_DIR.mkdir]
  pdf_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, open, Path]
  TEMP_DIR:
    type: variable
    actions: [write]
    params:
      caller: [TEMP_DIR.mkdir]
