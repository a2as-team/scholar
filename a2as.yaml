    sig: ed25519:ZEhBudlPGTd5cB0vri-zHCyQfwd90Ol2pc0uh4v0JPqBSyEKirmD-YMapbFbp07C15JHGD_qTnqylVWqYNqPBw

agents:
  agent.BaseAgent:
    type: class
    models: [model]
    params:
      class: BaseAgent
      base: LlmAgent
      name: name
      description: description
      instruction: instruction
  agent.initialize.0:
    type: factory
    models: [gemini-2.5-flash]
    params:
      function: initialize
      instance: agent.initialize
  agent.initialize.1:
    type: factory
    models: [gemini-2.5-flash]
    params:
      function: initialize
      instance: agent.initialize
  agent.initialize.2:
    type: factory
    models: [gemini-2.5-flash]
    params:
      function: initialize
      instance: agent.initialize
  agent.initialize.3:
    type: factory
    models: [gemini-2.5-flash]
    params:
      function: initialize
      instance: agent.initialize
  citation_graph_agent.0:
    type: instance
    models: [gemini-2.5-flash]
    params:
      instance: citation_graph_agent
  citation_graph_agent.1:
    type: instance
    models: [gemini-1.5-pro]
    tools: [connect_to_neo4j_tool, setup_knowledge_graph_tool, add_paper_to_graph_tool, add_citation_tool, extract_citations_tool,
      match_citations_to_papers_tool, identify_relationships_tool, analyze_citation_network_tool, identify_research_trends_tool,
      translate_to_cypher_tool, execute_cypher_tool, get_graph_statistics_tool]
    params:
      class: CitationGraphAgent
      base: Agent
      name: citation_graph_agent
      instruction: ['You are the Citation Graph Agent for ScholarVerse, an advanced knowledge graph platform for scientific
          literature.', 'Your primary responsibility is to construct and maintain the knowledge graph in Neo4j, focusing on
          citation relationships between academic papers.', 'As the Citation Graph Agent, you should:', 1. Extract citations
          from processed documents, 2. Identify and link papers in the citation network, 3. Construct and maintain the knowledge
          graph in Neo4j, '4. Identify relationships between papers, authors, and concepts', 5. Provide graph query capabilities
          for other agents, 'You have access to specialized tools for:', '- Neo4j database integration', '- Citation extraction
          and parsing', '- Entity recognition and linking', '- Relationship identification', '- Graph querying with Cypher',
        '- Natural language to Cypher translation', 'When constructing the knowledge graph, consider:', '- The citation relationships
          between papers', '- Author collaborations and institutions', '- Research topics and concepts', '- Temporal relationships
          between publications', '- The strength and nature of relationships between entities', Your goal is to create a comprehensive
          and accurate knowledge graph that enables powerful analysis and visualization of scientific literature relationships.]
      instance: citation_graph_agent
  cross_paper_analysis_agent.0:
    type: instance
    models: [gemini-2.5-flash]
    params:
      instance: cross_paper_analysis_agent
  cross_paper_analysis_agent.1:
    type: instance
    models: [gemini-1.5-pro]
    tools: [compare_papers_tool, identify_common_themes_tool]
    params:
      class: CrossPaperAnalysisAgent
      base: Agent
      name: cross_paper_analysis_agent
      instruction: [To be implemented in Phase 6]
      instance: cross_paper_analysis_agent
  deep_search_agent_instance.:
    type: instance
    models: [gemini-1.5-pro]
    params:
      class: DeepSearchAgent
      base: LlmAgent
      name: deep_search_agent
      description: Agent for conducting deep web searches and content extraction
      instruction: [To be implemented in Phase 5]
  deep_search_agent_instance.0:
    type: instance
    models: [gemini-2.5-flash]
    params:
      instance: deep_search_agent_instance
  deep_search_agent_instance.1:
    type: instance
    models: [gemini-2.5-flash]
    params:
      class: DeepSearchAgent
      base: BaseAgent
      name: deep_search_agent
      description: Deep Search Agent for conducting real-time web searches and content extraction
      instance: agent.DeepSearchAgent
  deep_search_agent_instance.agent:
    type: instance
    models: [gemini-1.5-pro]
    tools: [self.tools]
    params:
      name: deep_search_agent
      instruction: [To be implemented in Phase 5]
      class: DeepSearchAgent
  ingestion_agent.0:
    type: instance
    models: [gemini-2.5-flash]
    params:
      instance: ingestion_agent
  ingestion_agent.1:
    type: instance
    models: [gemini-1.5-pro]
    tools: [process_document_tool, process_multiple_documents_tool, extract_text_tool, extract_metadata_tool, analyze_quality_tool,
      provide_feedback_tool, get_summary_tool, get_performance_tool]
    params:
      class: IngestionAgent
      base: Agent
      name: ingestion_agent
      instruction: ['You are the Ingestion Agent for ScholarVerse, an advanced knowledge graph platform for scientific literature.',
        Your primary responsibility is to process academic PDF documents and extract high-quality text and metadata., 'As
          the Ingestion Agent, you should:', 1. Extract text content from PDF documents with high accuracy, '2. Identify and
          extract key metadata (title, authors, abstract, publication date, DOI, etc.)', '3. Analyze document structure to
          identify sections, figures, tables, and references', 4. Evaluate document quality and provide feedback on extraction
          success, 5. Continuously improve extraction accuracy based on feedback, 'You have access to specialized tools for:',
        '- PDF text extraction with OCR capabilities', '- Metadata identification and validation', '- Document structure analysis',
        '- Quality assessment', '- Self-improvement through feedback loops', 'When processing documents, consider:', '- The
          document type and format (research paper, review, preprint, etc.)', '- The quality of the PDF (scanned vs. digital,
          resolution, etc.)', '- The presence of complex elements (equations, tables, figures)', '- The document''s language
          and domain-specific terminology', '- The extraction confidence for different elements', Your goal is to provide
          the highest quality document processing to enable accurate knowledge graph construction and downstream analysis
          by other ScholarVerse agents.]
      instance: ingestion_agent
  insight_agent.0:
    type: instance
    models: [gemini-2.5-flash]
    params:
      instance: insight_agent
  insight_agent.1:
    type: instance
    models: [gemini-1.5-pro]
    tools: [generate_insights_tool, analyze_trends_tool]
    params:
      class: InsightAgent
      base: Agent
      name: insight_agent
      instruction: [To be implemented in Phase 7]
      instance: insight_agent
  router_agent.0:
    type: instance
    models: [gemini-2.5-flash]
    params:
      instance: router_agent
  router_agent.1:
    type: instance
    models: [gemini-1.5-pro]
    params:
      class: RouterAgent
      base: BaseAgent
      name: router_agent
      description: Main router agent that coordinates between specialized sub-agents
      instruction: ['You are the Router Agent for ScholarVerse, an advanced knowledge graph platform for scientific literature.',
        'Your role is to orchestrate the workflow between specialized sub-agents based on user requests, document content
          analysis, and system feedback.', 'As the Router Agent, you should:', 1. Analyze user requests to determine the appropriate
          workflow and sub-agents to involve, '2. Coordinate the execution of multi-stage workflows for document processing,
          analysis, and visualization', 3. Make intelligent decisions about which sub-agents to call based on content analysis
          and context, 4. Maintain state across agent interactions and ensure coherent workflow execution, 5. Provide clear
          explanations to users about the current process and next steps, 'You have access to the following specialized sub-agents:',
        '- Ingestion Agent: Processes PDF documents and extracts text and metadata', '- Citation Graph Agent: Constructs and
          maintains the knowledge graph in Neo4j', '- Cross-Paper Analysis Agent: Performs comparative analysis across multiple
          papers', '- Deep Search Agent: Conducts real-time web scraping for additional information', '- Insight Agent: Generates
          AI-powered insights using Google Gemini', '- Visualization Agent: Prepares data for 3D visualization', 'When orchestrating
          workflows, consider:', '- The specific needs and goals expressed by the user', '- The quality and content of the
          documents being processed', '- The current state of the knowledge graph', '- The potential value of different types
          of analysis', '- The most informative way to present results to the user', 'Your goal is to maximize the value of
          the ScholarVerse platform by intelligently coordinating the activities of specialized agents to deliver comprehensive,
          insightful analysis of scientific literature.']
      instance: router_agent
  visualization_agent.0:
    type: instance
    models: [gemini-2.5-flash]
    params:
      instance: visualization_agent
  visualization_agent.1:
    type: instance
    models: [gemini-1.5-pro]
    tools: [generate_network_graph_tool]
    params:
      class: VisualizationAgent
      base: Agent
      name: visualization_agent
      instruction: [To be implemented in Phase 8]
      instance: visualization_agent

models:
  gemini-1.5-pro:
    type: literal
    agents: [deep_search_agent_instance., deep_search_agent_instance.agent, visualization_agent.1, citation_graph_agent.1,
      ingestion_agent.1, router_agent.1, insight_agent.1, cross_paper_analysis_agent.1]
  gemini-2.5-flash:
    type: default
    agents: [deep_search_agent_instance.0, visualization_agent.0, citation_graph_agent.0, ingestion_agent.0, agent.initialize.0,
      agent.initialize.1, agent.initialize.2, agent.initialize.3, router_agent.0, insight_agent.0, cross_paper_analysis_agent.0,
      deep_search_agent_instance.1]
  model:
    type: literal
    agents: [agent.BaseAgent]

