    branch: main
    commit: "d048cba1"
    scope: [scholar_verse/agent.py, scholar_verse/base_agent.py, scholar_verse/config.py, scholar_verse/main.py, scholar_verse/prompt.py,
      scholar_verse/shared_libraries/logging_utils.py, scholar_verse/shared_libraries/memory_manager.py, scholar_verse/shared_libraries/session_manager.py,
      scholar_verse/shared_libraries/state_management/adaptive_state.py, scholar_verse/shared_libraries/state_manager.py,
      scholar_verse/shared_libraries/utils/circuit_breaker.py, scholar_verse/sub_agents/citation_graph/agent.py, scholar_verse/sub_agents/citation_graph/tools/citation_extraction.py,
      scholar_verse/sub_agents/citation_graph/tools/neo4j_integration.py, scholar_verse/sub_agents/citation_graph/tools/nl2cypher.py,
      scholar_verse/sub_agents/citation_graph/tools/relationship_identification.py, scholar_verse/sub_agents/cross_paper_analysis/agent.py,
      scholar_verse/sub_agents/deep_search/agent.py, scholar_verse/sub_agents/deep_search/prompt.py, scholar_verse/sub_agents/deep_search/tools/__init__.py,
      scholar_verse/sub_agents/deep_search/tools/base_tool.py, scholar_verse/sub_agents/deep_search/tools/content_extraction.py,
      scholar_verse/sub_agents/deep_search/tools/rag_integration.py, scholar_verse/sub_agents/deep_search/tools/validation.py,
      scholar_verse/sub_agents/deep_search/tools/web_scraper.py, scholar_verse/sub_agents/ingestion/agent.py, scholar_verse/sub_agents/ingestion/tools/document_processor.py,
      scholar_verse/sub_agents/ingestion/tools/extraction_improvement.py, scholar_verse/sub_agents/ingestion/tools/pdf_extraction.py,
